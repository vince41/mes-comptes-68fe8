<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031a31"><title>Mes Comptes</title><link rel="manifest" href="manifest.webmanifest"><style>html,body{margin:0;background:#021323;color:#fff;font-family:system-ui}#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}#boot b{color:#f4c767;font-size:1.3rem}</style></head><body><div id="boot"><div><b>Mes Comptes V0.5.5</b><p>Chargement…</p></div></div><script>(async()=>{try{
const files=['app055-1.b64','app055-2.b64','app055-3.b64','app055-4.b64'];
const parts=await Promise.all(files.map(f=>fetch(f+'?v=055',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));
const p=await fetch('photo.b64?v=055',{cache:'no-store'}).then(r=>r.text());
const all=parts.join('').trim();
const bin=Uint8Array.from(atob(all),c=>c.charCodeAt(0));
const ds=new DecompressionStream('gzip');
let html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
const photo='data:image/webp;base64,'+p.trim();
const extra=`<script>(function(){
function importFix(){var b=document.getElementById('importBtn'),f=document.getElementById('importFile'),s=document.getElementById('importState');if(!b||!f)return;b.style.display='inline-flex';b.disabled=false;b.textContent='Charger mon historique privé';if(s&&!localStorage.getItem('comptes-differe-v042'))s.textContent='Choisis ton fichier JSON privé une seule fois.';b.onclick=function(e){e.preventDefault();f.click();};}
function fuelFix(){try{if(typeof fixedProjectionTemplates==='function'){fixedProjectionTemplates=function(){var source=(state&&state.transactions&&state.transactions.length)?state.transactions:[];var preferred='2026-11';var ref=source.some(function(t){return t.month===preferred})?preferred:null;if(!ref){var ms=Array.from(new Set(source.map(function(t){return t.month}).filter(Boolean))).sort();ref=ms.length?ms[ms.length-1]:preferred}function fuel(t){var x=(String(t&&t.label||'')+' '+String(t&&t.note||'')).toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');return t&&t.type==='expense'&&(x.includes('essence')||x.includes('carburant'))}return source.filter(function(t){if(t.month!==ref)return false;var row=Number(t.sourceRow||999);return (t.type==='income'&&row<=5)||(t.type==='expense'&&(row<=39||fuel(t)))}).map(function(t){return Object.assign({},t)})};if(typeof render==='function')render();}}catch(e){console.error(e)}}
importFix();fuelFix();setTimeout(importFix,400);
})();<\/script>`;
html=html.replaceAll('__PHOTO__',photo).replace('</body>',extra+'</body>');
document.open();document.write(html);document.close();
}catch(e){document.getElementById('boot').innerHTML='<div><b>Erreur de chargement V0.5.5</b><p>'+String(e.message||e)+'</p></div>';console.error(e)}})();</script></body></html>
